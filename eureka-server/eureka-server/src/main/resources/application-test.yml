server:
  port: 0

spring:
  application:
    name: eureka-server-test

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
