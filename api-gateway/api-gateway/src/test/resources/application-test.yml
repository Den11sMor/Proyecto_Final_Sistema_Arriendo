server:
  port: 0

spring:
  application:
    name: api-gateway-test
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: ms-clientes-route
              uri: http://localhost:8081
              predicates:
                - Path=/ms-clientes/**
              filters:
                - StripPrefix=1
            - id: ms-vehiculos-route
              uri: http://localhost:8082
              predicates:
                - Path=/ms-vehiculos/**
              filters:
                - StripPrefix=1
            - id: ms-reservas-route
              uri: http://localhost:8083
              predicates:
                - Path=/ms-reservas/**
              filters:
                - StripPrefix=1
            - id: ms-pagos-route
              uri: http://localhost:8084
              predicates:
                - Path=/ms-pagos/**
              filters:
                - StripPrefix=1
            - id: ms-sucursales-route
              uri: http://localhost:8085
              predicates:
                - Path=/ms-sucursales/**
              filters:
                - StripPrefix=1
            - id: ms-empleados-route
              uri: http://localhost:8086
              predicates:
                - Path=/ms-empleados/**
              filters:
                - StripPrefix=1
            - id: ms-reportes-route
              uri: http://localhost:8087
              predicates:
                - Path=/ms-reportes/**
              filters:
                - StripPrefix=1

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  level:
    com.duoc.api_gateway: WARN
    org.springframework: WARN
    org.springframework.cloud.gateway: WARN